\":\"LiveStories\",\"role\":\"Senior Software Engineer\",\"start\":2018.08,\"end\":2019.92,\"color\":\"#1b24fb\",\"note\":\"Led React chart editor across ~12 chart types for public-sector data storytelling. Defined the units/dimensions model for multi-dimensional data segmentation. Co-piloted TypeScript adoption across the codebase.\"},{\"company\":\"Simply Measured\",\"role\":\"Senior Software Engineer\",\"start\":2015.5,\"end\":2018.08,\"color\":\"#3b97e0\",\"note\":\"Built DashCap: headless Express/Nightmare.js screenshot service for PDF/PNG dashboard exports. Shipped d3 word cloud Ember addon with strong client reception. Coordinated maintenance across 5 Ember.js apps.\"},{\"company\":\"MITRE\",\"role\":\"Software Engineer\",\"start\":2013.67,\"end\":2015.42,\"color\":\"#005b94\",\"note\":\"Built healthcare informatics tools under federal contract. MongoDB map-reduce enabled eCQM patient testing in seconds vs. days. Led FE on Crucible: one of the earliest HL7 FHIR interoperability validators.\"}]";

  function renderGantt() {
    const roles = JSON.parse(workJson);

    const YEAR_START = 2013.5;
    const YEAR_END = 2027.0;
    const RANGE = YEAR_END - YEAR_START;

    const now = (() => {
      const d = new Date();
      return d.getFullYear() + (d.getMonth() + d.getDate() / 31) / 12;
    })();

    function effectiveEnd(r) {
      return r.end === "present" ? now : r.end;
    }

    function pct(year) {
      return (((year - YEAR_START) / RANGE) * 100).toFixed(3) + "%";
    }
    function pctNum(year) {
      return ((year - YEAR_START) / RANGE) * 100;
    }
    function hexAlpha(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }
    function relativeLuminance(hex) {
      const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
      const lin = (c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
      return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    }
    // The bar is painted at BAR_ALPHA over the page's animated background (src/styles/global.css),
    // whose keyframes are all light pastels. Compositing over white (the lightest plausible case)
    // gives the worst-case (lowest-contrast) rendered color, so picking label color against that
    // stays AA-compliant against every actual background the bar can appear over.
    const BAR_ALPHA = 0.82;
    function compositeOverWhite(hex, alpha) {
      const channel = (i) =>
        Math.round(alpha * parseInt(hex.slice(i, i + 2), 16) + (1 - alpha) * 255);
      return `#${[1, 3, 5].map((i) => channel(i).toString(16).padStart(2, "0")).join("")}`;
    }

    const gantt = document.getElementById("gantt");
    if (!gantt) return;
    gantt.innerHTML = "";
    const gridYears = [];
    for (let y = Math.ceil(YEAR_START); y <= Math.floor(YEAR_END); y++) gridYears.push(y);

    const todayLine = document.createElement("div");
    todayLine.className = "today-line";
    todayLine.style.left = pct(now);
    gantt.appendChild(todayLine);

    roles.forEach((r, idx) => {
      const row = document.createElement("div");
      row.className = "gantt-row";

      const track = document.createElement("div");
      track.className = "gantt-track";

      gridYears.forEach((y) => {
        const line = document.createElement("div");
        line.className = "year-line";
        line.style.left = pct(y);
        track.appendChild(line);
      });

      const bar = document.createElement("div");
      bar.className = "gantt-bar";
      bar.style.backgroundColor = hexAlpha(r.color, BAR_ALPHA);
      const leftPct = pctNum(r.start);
      const widthPct = pctNum(effectiveEnd(r)) - leftPct;
      bar.style.left = leftPct.toFixed(3) + "%";
      bar.style.width = widthPct.toFixed(3) + "%";
      const endYearLabel = r.end === "present" ? "present" : Math.floor(r.end);
      bar.setAttribute(
        "aria-label",
        `${r.company}, ${r.role}, ${Math.floor(r.start)}–${endYearLabel}`
      );
      bar.setAttribute("role", "img");
      bar.tabIndex = 0;

      const noteId = `gantt-note-${idx}`;
      bar.setAttribute("aria-describedby", noteId);
      const noteEl = document.createElement("span");
      noteEl.className = "sr-only";
      noteEl.id = noteId;
      noteEl.textContent = r.note;
      bar.appendChild(noteEl);

      const barLabel = document.createElement("div");
      barLabel.className = "gantt-bar-label";
      barLabel.style.color =
        relativeLuminance(compositeOverWhite(r.color, BAR_ALPHA)) > 0.179 ? "#000" : "#fff";
      barLabel.textContent = formatDuration(effectiveEnd(r) - r.start, true);
      bar.appendChild(barLabel);

      const onBarScroll = () => positionTooltipNear(bar);
      bar.addEventListener("mouseenter", (e) => showTooltip(e, r));
      bar.addEventListener("mousemove", moveTooltip);
      bar.addEventListener("mouseleave", hideTooltip);
      bar.addEventListener("focus", () => {
        showTooltipAtElement(bar, r);
        window.addEventListener("scroll", onBarScroll, { passive: true });
      });
      bar.addEventListener("blur", () => {
        hideTooltip();
        window.removeEventListener("scroll", onBarScroll);
      });

      track.appendChild(bar);
      row.appendChild(track);
      gantt.appendChild(row);
    });

    const axisTrack = document.getElementById("axis-track");
    axisTrack.innerHTML = "";
    [2014, 2016, 2018, 2020, 2022, 2024, 2026].forEach((y) => {
      const lbl = document.createElement("div");
      lbl.className = "axis-label";
      lbl.style.left = pct(y);
      lbl.textContent = y;
      axisTrack.appendChild(lbl);
    });

    const totalYears = Math.round(roles.reduce((s, r) => s + (effectiveEnd(r) - r.start), 0));
    const statText = `${totalYears}+ years · ${roles.length} companies`;
    document.getElementById("tenure-sub").textContent = statText;
    document.getElementById("foot-stat").textContent = statText;

    const tooltip = document.getElementById("tooltip");

    // on window so ClientRouter page swaps keep only one Escape listener
    window.workTooltipAbort?.abort();
    window.workTooltipAbort = new AbortController();
    document.addEventListener(
      "keydown",
      (e) => {
        if (e.key === "Escape") hideTooltip();
      },
      { signal: window.workTooltipAbort.signal }
    );

    // Under a year reads in months; otherwise whole years
    function formatDuration(years, short = false) {
      if (years < 1) {
        const m = Math.max(1, Math.round(years * 12));
        return short ? `${m}m` : `${m} mo${m !== 1 ? "s" : ""}`;
      }
      const y = Math.round(years);
      return short ? `${y}y` : `${y} yr${y !== 1 ? "s" : ""}`;
    }

    function renderTooltipContent(r) {
      const startY = Math.floor(r.start);
      const endY = r.end === "present" ? "present" : Math.floor(r.end);
      tooltip.innerHTML = `
      <div class="tt-company">${r.company}</div>
      <div class="tt-role">${r.role}</div>
      <div class="tt-dates">${startY} – ${endY} · ${formatDuration(effectiveEnd(r) - r.start)}</div>
      <div class="tt-note">${r.note}</div>
    `;
      tooltip.classList.add("show");
    }

    function showTooltip(e, r) {
      renderTooltipContent(r);
      moveTooltip(e);
    }

    function showTooltipAtElement(el, r) {
      renderTooltipContent(r);
      positionTooltipNear(el);
    }

    function moveTooltip(e) {
      const pad = 16;
      let x = e.clientX + pad;
      let y = e.clientY + pad;
      const tw = tooltip.offsetWidth;
      const th = tooltip.offsetHeight;
      if (x + tw > window.innerWidth - pad) x = e.clientX - tw - pad;
      if (y + th > window.innerHeight - pad) y = Math.max(pad, e.clientY - th - pad);
      tooltip.style.left = x + "px";
      tooltip.style.top = y + "px";
    }

    function positionTooltipNear(el) {
      const pad = 16;
      const rect = el.getBoundingClientRect();
      const tw = tooltip.offsetWidth;
      const th = tooltip.offsetHeight;
      let x = rect.left;
      let y = rect.bottom + pad;
      if (x + tw > window.innerWidth - pad) x = window.innerWidth - pad - tw;
      if (y + th > window.innerHeight - pad) y = Math.max(pad, rect.top - th - pad);
      tooltip.style.left = x + "px";
      tooltip.style.top = y + "px";
    }

    function hideTooltip() {
      tooltip.classList.remove("show");
    }
  } // end renderGantt

  document.addEventListener("astro:page-load", renderGantt);
})();</script>
